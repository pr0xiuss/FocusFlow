<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusFlow - Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
    <link rel="icon" type="image/png"  href="FocusFlow-removebg-preview.png">
</head>
<body>

    <div class="auth-container">
        <div class="auth-form-panel">
            <div class="auth-header">
                <a href="index.html">
                <img src="FocusFlow-removebg-preview.png" alt="FocusFlow Logo" class="auth-logo"> <!-- Placeholder for your logo -->
                </a>
                <div class="auth-brand-text">FocusFlow</div>
            </div>

            <div class="auth-content">
                <h1>Welcome Back!</h1>
                <p class="auth-intro-text">Please enter login details below</p>

                <form id="login-form" class="auth-form">
                    <div class="form-group">
                        <label for="username">Username</label>
                         <input type="text" id="username" name="username" placeholder="Enter your username" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    </div>
                    <div class="forgot-password">
                        <a href="#" class="forgot-password-link">Forgot password?</a>
                    </div>
                    <button type="submit" class="button auth-button">Sign In</button>
                </form>

                <p class="auth-switch-text">Don't have an account? <a href="signup.html" class="auth-switch-link">Sign Up</a></p>
            </div>
        </div>

        <div class="auth-illustration-panel">
            <p class="auth-illustration-text">Manage your tasks in an easy and more efficient way with FocusFlow...</p>
        </div>
    </div>
    <script src="script.js"></script>
    <script src="auth.js"></script>
</body>
</html>
