<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusFlow - My Tasks</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="tasks.css">
</head>
<body>

  <header>
    <nav class="navbar container">
      <a href="index.html" class="navbar-brand">FocusFlow</a>
      <ul class="navbar-nav">
        <li class="nav-item nav-search-add">
          <input type="text" id="global-search-tasks" placeholder="Search tasks..." class="navbar-search-input">
        </li>
        <li class="nav-item">
          <button id="show-add-task-form-button" class="button navbar-add-button">Add Task</button>
        </li>
        <li><span id="user-greeting" class="nav-link" style="color: white; cursor: default;"></span></li>
        <li><a href="#" id="logout-button" class="button secondary">Logout</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">

    <!-- Stats Section -->
    <section class="stats-cards-section">
      <div class="stats-grid">
        <div class="stat-card" id="total-tasks-card">
          <div class="stat-icon">📈</div>
          <div class="stat-info">
            <div class="stat-value" id="stat-total-tasks">0</div>
            <div class="stat-label">Total Tasks</div>
          </div>
        </div>
        <div class="stat-card" id="pending-tasks-card">
          <div class="stat-icon">⏳</div>
          <div class="stat-info">
            <div class="stat-value" id="stat-pending-tasks">0</div>
            <div class="stat-label">Pending</div>
          </div>
        </div>
        <div class="stat-card" id="completed-tasks-card">
          <div class="stat-icon">✅</div>
          <div class="stat-info">
            <div class="stat-value" id="stat-completed-tasks">0</div>
            <div class="stat-label">Completed</div>
          </div>
        </div>
        <div class="stat-card" id="overdue-tasks-card">
          <div class="stat-icon">🚨</div>
          <div class="stat-info">
            <div class="stat-value" id="stat-overdue-tasks">0</div>
            <div class="stat-label">Overdue</div>
          </div>
        </div>
      </div>
    </section>

    <!-- Filter & Sort -->
    <section class="filters-sort-section">
      <div class="filters-sort-controls">
        <div class="form-group">
          <label for="filter-category">Category:</label>
          <select id="filter-category">
            <option value="all">All Categories</option>
            <option value="work">Work</option>
            <option value="personal">Personal</option>
            <option value="shopping">Shopping</option>
            <option value="home">Home</option>
            <option value="study">Study</option>
          </select>
        </div>
        <div class="form-group">
          <label for="filter-status">Status:</label>
          <select id="filter-status">
            <option value="all">All Statuses</option>
            <option value="false">Incomplete</option>
            <option value="true">Completed</option>
          </select>
        </div>
        <div class="form-group">
          <label for="sort-by">Sort by:</label>
          <select id="sort-by">
            <option value="created_at_desc">Newest First</option>
            <option value="title_asc">Title (A-Z)</option>
            <option value="title_desc">Title (Z-A)</option>
            <option value="due_date_asc">Due Date (Earliest)</option>
            <option value="due_date_desc">Due Date (Latest)</option>
            <option value="completed_asc">Incomplete First</option>
            <option value="completed_desc">Completed First</option>
            <option value="category_asc">Category (A-Z)</option>
            <option value="category_desc">Category (Z-A)</option>
          </select>
        </div>
        <button id="apply-filters-sort" class="button">Apply</button>
        <button id="reset-filters-sort" class="button secondary">Reset</button>
      </div>
    </section>

    <!-- Tasks -->
    <section id="task-list-section">
      <div class="task-grid-container">
        <p id="no-tasks-message" style="display: none;">You haven't added any tasks yet. Use the button above to get started!</p>
        <p class="loading-message">Loading tasks...</p>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2025 FocusFlow. All rights reserved.</p>
    </div>
  </footer>

  <!-- ✅ Add Task Modal -->
  <div id="add-task-modal" class="modal">
    <div class="modal-content">
      <span class="close-button">&times;</span>
      <h3>Add Task</h3>
      <form id="add-task-form">
        <input type="hidden" id="add-task-parent-id" name="parent_task"> <!-- set via JS -->
        <div class="form-group">
          <label for="new-task-title">Task Title</label>
          <input type="text" id="new-task-title" name="title" placeholder="e.g., Prepare project report" required>
        </div>
        <div class="form-group">
          <label for="new-task-description">Description (Optional)</label>
          <textarea id="new-task-description" name="description"></textarea>
        </div>
        <div class="form-grid">
          <div class="form-group">
            <label for="new-task-due-date">Due Date (Optional)</label>
            <input type="date" id="new-task-due-date" name="due_date">
          </div>
          <div class="form-group">
            <label for="new-task-category">Category (Optional)</label>
            <select id="new-task-category" name="category">
              <option value="">Select Category</option>
              <option value="work">Work</option>
              <option value="personal">Personal</option>
              <option value="shopping">Shopping</option>
              <option value="home">Home</option>
              <option value="study">Study</option>
            </select>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="button">Add Task</button>
          <button type="button" class="button secondary close-button">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Existing Edit Modal stays unchanged -->
  <div id="edit-task-modal" class="modal">
    <div class="modal-content">
      <span class="close-button">&times;</span>
      <h3>Edit Task</h3>
      <form id="edit-task-form">
        <input type="hidden" id="edit-task-id" name="id">
        <!-- ... your edit form fields ... -->
      </form>
    </div>
  </div>

  <script src="script.js"></script>
  <script src="tasks.js"></script>
</body>
</html>
