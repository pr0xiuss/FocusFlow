<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusFlow - Sign Up</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
    <link rel="icon" type="image/png"  href="FocusFlow-removebg-preview.png">
</head>
<body>

    <div class="auth-container">
        <div class="auth-form-panel">
            <div class="auth-header">
                <a href="index.html">
                <img src="FocusFlow-removebg-preview.png" alt="FocusFlow Logo" class="auth-logo">
                </a>
                <div class="auth-brand-text">FocusFlow</div>
            </div>

            <div class="auth-content">
                <h1>Create an Account!</h1> 
                <p class="auth-intro-text">Join FocusFlow and start organizing your tasks.</p> <!-- UPDATED INTRO TEXT -->

                <form id="signup-form" class="auth-form" method="post" action=""> 
                    <div class="form-group">
                        <label for="username">Username</label> 
                        <input type="text" id="username" name="username" placeholder="Choose a username" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label> 
                        <input type="email" id="email" name="email" placeholder="Enter your email (optional)" > <!-- UPDATED PLACEHOLDER/OPTIONAL -->
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="pwd" placeholder="Create a password" required>
                    </div>
                    <div class="form-group">
                        <label for="password2">Confirm Password</label> 
                        <input type="password" id="password2" name="pwd2" placeholder="Confirm your password" required>
                    </div>

                    <button type="submit" class="button auth-button">Sign Up</button> 
                </form>

                <p class="auth-switch-text">Already have an account? <a href="login.html" class="auth-switch-link">Log In</a></p> <!-- UPDATED SWITCH TEXT AND LINK -->
            </div>
        </div>

        <div class="auth-illustration-panel">
            <p class="auth-illustration-text">Get started organizing your goals and boosting productivity with FocusFlow.</p> <!-- UPDATED TEXT -->
        </div>
    </div>

    <script src="script.js"></script>
    <script src="auth.js"></script>
</body>
</html>
